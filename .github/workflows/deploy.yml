name: Build and Deploy to Pages

on:
  push:
    branches: ['main'] # Change to 'master' if your main branch is named master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # This step scans your public files and creates the files.json your index.html needs
      - name: Generate Local File List JSON
        run: |
          python3 -c "
          import os, json
          files = []
          for entry in os.scandir('.'):
              if entry.name.startswith('.'): continue
              ftype = 'dir' if entry.is_dir() else 'file'
              files.append({
                  'name': entry.name,
                  'type': ftype,
                  'html_url': f'https://github.com/${{ github.repository }}/blob/main/{entry.name}'
              })
          with open('files.json', 'w') as f:
              json.dump(files, f)
          "

       Caviar:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
